name: Build Linux AppImage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.11.0'
      - run: echo '5fdd48f87e703eedff1fb128843c0762a40afe6ef146c67e3f000ffec9c7091a  max-launcher-source.zip' | sha256sum --check --strict
      - run: |
          python3 -c "import zipfile; z=zipfile.ZipFile('max-launcher-source.zip'); [setattr(i,'filename',i.filename.replace(chr(92),'/')) for i in z.infolist()]; z.extractall('app',members=z.infolist())"
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run dist:linux
        working-directory: app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max-launcher-linux-x64
          path: app/release/*.AppImage
          if-no-files-found: error
          retention-days: 7
